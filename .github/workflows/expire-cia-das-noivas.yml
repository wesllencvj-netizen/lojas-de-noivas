name: Expirar Cia das Noivas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar prazo e remover rota
        shell: bash
        run: |
          expires_at=1789762723
          now=$(date -u +%s)

          if [ "$now" -lt "$expires_at" ]; then
            echo "A rota ainda está dentro do prazo."
            exit 0
          fi

          rm -rf cia-das-noivas
          rm -f .github/workflows/expire-cia-das-noivas.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: expira página da Cia das Noivas"
          git push
