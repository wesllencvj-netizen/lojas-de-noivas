<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Conheça lojas de noivas e encontre o traje ideal para sua celebração.">
  <title>Lojas de Noivas</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:2rem;background:#faf8f3;color:#0b0a09;font-family:Georgia,serif}.catalog{width:min(960px,100%)}span{font:600 .7rem/1.4 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#8b682d}h1{font-size:clamp(3rem,9vw,6.5rem);font-weight:400;line-height:.9;margin:.8rem 0 3rem;text-wrap:balance}.store{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;padding:1.5rem 0;border-block:1px solid #d8d2c8;text-decoration:none;color:inherit}.store h2{font-size:clamp(1.8rem,5vw,3.25rem);font-weight:400;margin:0}.store p{margin:.4rem 0 0;color:#665f56;font:400 .9rem/1.6 Arial,sans-serif}.store b{display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;background:#0b0a09;color:#fff;font:400 1rem Arial,sans-serif;transition:transform .25s ease}.store:hover b{transform:translate(4px,-4px)}.store:focus-visible{outline:2px solid #9b7738;outline-offset:8px}@media(max-width:520px){.store{gap:1rem}}
  </style>
</head>
<body>
  <main class="catalog">
    <span>Diretório</span>
    <h1>Lojas de Noivas</h1>
    <a class="store" href="cia-das-noivas/" data-store="cia-das-noivas" data-expires="2026-09-18T20:18:43Z">
      <div><h2>Cia das Noivas</h2><p>Santarém, Pará · Vestidos, ternos e acessórios</p></div>
      <b aria-hidden="true">↗</b>
    </a>
    <p id="expired-message" hidden>Esta apresentação não está mais disponível.</p>
  </main>
  <script>
    const store = document.querySelector('[data-store="cia-das-noivas"]');
    if (store && Date.now() >= Date.parse(store.dataset.expires)) {
      store.remove();
      document.querySelector('#expired-message').hidden = false;
    }
  </script>
</body>
</html>
